name: Provision AWS Infrastructure

on:
  push:
    branches:
      - main
      - ft-rds-cache

jobs:
  infra-0:
    name: Run Terraform infra-0
    runs-on: ubuntu-latest

    env:
      CLUSTER_IDENTIFIER: ${{ secrets.CLUSTER_IDENTIFIER }}
      MASTER_USERNAME: ${{ secrets.MASTER_USERNAME }}
      MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      PROXY_NAME: ${{ secrets.PROXY_NAME }}
      CLUSTER_ID: ${{ secrets.CLUSTER_ID }}
      SG_NAME: ${{ secrets.SG_NAME }}
      VPC_NAME: ${{ secrets.VPC_NAME }}
      RDS_PROXY_SECRET_NAME: ${{ secrets.RDS_PROXY_SECRET_NAME }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      REGION: ${{ vars.REGION }}
      PEER_VPC_ID: ${{ vars.PEER_VPC_ID }}
      PEER_SECURITY_GROUP_ID: ${{ vars.PEER_SECURITY_GROUP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set execution permissions
        working-directory: 0-infra
        run: ls && chmod +x generate_tfvars.sh

      - name: Generate terraform.tfvars
        working-directory: 0-infra
        run: ./generate_tfvars.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ secrets.TF_CLI_CONFIG }}

      - name: Initialize Terraform
        run: terraform init
        working-directory: 0-infra

      - name: Plan Terraform deployment
        run: terraform plan -out=tfplan
        working-directory: 0-infra

      - name: Apply Terraform deployment
        run: terraform apply -auto-approve tfplan
        working-directory: 0-infra

      - name: Retrieve Terraform output
        id: get_output
        run: |
          echo "PEER_VPC_ID=$(terraform output -raw vpc_id)" >> $GITHUB_ENV
          echo "PEER_SECURITY_GROUP_ID=$(terraform output -raw security_group_id)" >> $GITHUB_ENV
        working-directory: 0-infra

  infra-1:
    name: Run Terraform infra-1
    runs-on: ubuntu-latest
    needs: infra-0

    env:
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
      PEER_SECURITY_GROUP_ID: ${{ vars.PEER_SECURITY_GROUP_ID }}
      PEER_VPC_ID: ${{ vars.PEER_VPC_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      REGION: ${{ vars.REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set execution permissions
        working-directory: 0-infra
        run: ls && chmod +x generate_tfvars.sh

      - name: Generate terraform.tfvars
        working-directory: 0-infra
        run: ./generate_tfvars.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
            cli_config_credentials_token: ${{ secrets.TF_CLI_CONFIG }}

      - name: Initialize Terraform
        run: terraform init
        working-directory: 1-infra

      - name: Plan Terraform deployment
        run: terraform plan -out=tfplan
        working-directory: 1-infra

      - name: Apply Terraform deployment
        run: terraform apply -auto-approve tfplan
        working-directory: 1-infra